name: Deploy Modal backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/modal-backend.yml

  deploy:
    name: Deploy checked commit to Modal
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal deployment credentials
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo 'Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET in GitHub Actions secrets.' >&2
            exit 1
          fi
      - name: Install Modal CLI
        run: python -m pip install 'modal>=1.3,<2'
      - name: Deploy T4 backend
        env:
          MODAL_GPU: T4
        run: modal deploy modal_app.py --tag "$GITHUB_SHA"
      - name: Verify deployed app exists
        run: modal app info tai-sinh-di-san-so-api --json > modal-app-info.json
      - name: Summarize deployment
        if: always()
        run: |
          echo "## Modal Production" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment result: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'This check confirms the Modal deployment exists. It does not start a GPU or prove image generation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a live smoke test, check Modal /health and generate four images through Vercel during an approved GPU test.' >> "$GITHUB_STEP_SUMMARY"
