AWSTemplateFormatVersion: '2010-09-09'
Description: On-demand Modal deployment from AWS CodeBuild without GitHub-held Modal credentials.

Parameters:
  RepositoryUrl:
    Type: String
    Default: https://github.com/quoczai22/tai-sinh-di-san-so-ai.git
  ProjectName:
    Type: String
    Default: tai-sinh-di-san-so-ai-modal-deploy
  AlertEmail:
    Type: String
    Description: Email address for monthly AWS cost alerts.

Resources:
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: tai-sinh-di-san-so-ai-aws-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  DeployLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ProjectName}
      RetentionInDays: 7

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: modal-deploy-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${ProjectName}:*
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tai-sinh-di-san-so-ai/modal-cd/token-id
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/tai-sinh-di-san-so-ai/modal-cd/token-secret
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm

  DeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      Description: Manual deployment of the checked main commit to Modal T4.
      ServiceRole: !GetAtt DeployRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 30
      Source:
        Type: GITHUB
        Location: !Ref RepositoryUrl
        GitCloneDepth: 1
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.11
              commands:
                - python -m pip install 'modal>=1.3,<2'
            pre_build:
              commands:
                - test -n "$MODAL_TOKEN_ID" && test -n "$MODAL_TOKEN_SECRET"
                - test -n "$CODEBUILD_RESOLVED_SOURCE_VERSION"
                - |
                  python - <<'PY'
                  import json, os, urllib.request
                  sha = os.environ['CODEBUILD_RESOLVED_SOURCE_VERSION']
                  assert len(sha) == 40 and all(c in '0123456789abcdef' for c in sha), 'Source is not a commit SHA'
                  url = 'https://api.github.com/repos/quoczai22/tai-sinh-di-san-so-ai/actions/workflows/modal-backend.yml/runs?head_sha=' + sha + '&status=success&per_page=10'
                  req = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'modal-cd-check'})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      runs = json.load(response).get('workflow_runs', [])
                  assert any(run.get('head_sha') == sha and run.get('head_branch') == 'main' and run.get('conclusion') == 'success' for run in runs), 'CI has not passed on this main commit'
                  print('CI passed for main commit', sha)
                  PY
                - echo "Deploying commit $CODEBUILD_RESOLVED_SOURCE_VERSION"
            build:
              commands:
                - modal deploy modal_app.py --tag "$CODEBUILD_RESOLVED_SOURCE_VERSION"
            post_build:
              commands:
                - modal app info tai-sinh-di-san-so-api --json > /tmp/modal-app-info.json
                - echo "Modal app exists; no GPU health request was made."
      SourceVersion: main
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: MODAL_TOKEN_ID
            Type: PARAMETER_STORE
            Value: /tai-sinh-di-san-so-ai/modal-cd/token-id
          - Name: MODAL_TOKEN_SECRET
            Type: PARAMETER_STORE
            Value: /tai-sinh-di-san-so-ai/modal-cd/token-secret
          - Name: MODAL_GPU
            Type: PLAINTEXT
            Value: T4
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref DeployLogGroup

Outputs:
  CodeBuildProject:
    Value: !Ref DeployProject
  CodeBuildConsole:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${ProjectName}/history?region=${AWS::Region}
